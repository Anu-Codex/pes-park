<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profile | NEXUS LEGENDS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;600;700&display=swap');
        :root { --bg: #060b13; --card: #101926; --border: #1e293b; --accent: #10b981; --gold: #f59e0b; --text-dim: #94a3b8; }

        body { background-color: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 15px; padding-bottom: 60px; }
        .container { max-width: 500px; margin: auto; }
        .back-nav { margin-bottom: 20px; }
        .back-nav a { color: var(--text-dim); text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 1rem; }

        /* HEADER CARD (IMAGE 1) */
        .header-card { background: var(--card); border-radius: 24px; border: 1px solid var(--border); padding: 25px 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .t-logo-frame { width: 85px; height: 85px; border-radius: 18px; overflow: hidden; background: #000; border: 1px solid var(--border); }
        .t-logo-frame img { width: 100%; height: 100%; object-fit: contain; }
        .header-info span { color: var(--text-dim); font-size: 0.65rem; letter-spacing: 2px; font-weight: bold; }
        .header-info h1 { margin: 2px 0; font-size: 1.6rem; font-family: 'Orbitron'; text-transform: uppercase; }
        .header-info p { margin: 0; color: var(--text-dim); font-size: 0.85rem; }
        .title-summary { color: var(--gold); font-weight: bold; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; margin-top: 5px; }

        /* ANALYTICS (IMAGE 2) */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 15px; text-align: center; }
        .stat-num { display: block; font-size: 1.5rem; font-weight: 800; color: var(--accent); font-family: 'Orbitron'; }
        .stat-label { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        /* WIN RATE (IMAGE 2) */
        .win-rate-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 25px; }
        .wr-perc { font-size: 2rem; font-weight: 900; color: var(--accent); font-family: 'Orbitron'; }

        /* CABINET (IMAGE 2) */
        .cabinet-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 25px; }
        .cabinet-header { display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--gold); padding-left: 12px; margin-bottom: 20px; }
        .trophy-stage { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 25px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(245, 158, 11, 0.1); }
        .main-trophy-img { width: 55px; filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.3)); }
        .trophy-pill { background: rgba(16, 185, 129, 0.05); border: 1px solid var(--accent); color: var(--accent); padding: 5px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: bold; margin-bottom: 5px; display: inline-block; }

        /* ROSTER LIST (IMAGE 1) */
        .roster-card { background: var(--card); border-radius: 24px; border: 1px solid var(--border); overflow: hidden; }
        .player-row { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.03); text-decoration: none; color: inherit; }
        .rank-circle { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: bold; color: var(--text-dim); margin-right: 15px; }
        .rank-circle.cap-gold { background: rgba(245, 158, 11, 0.1); border-color: var(--gold); color: var(--gold); }
        .p-avatar { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: #000; margin-right: 15px; }
        .p-info { flex: 1; }
        .p-info h3 { margin: 0; font-size: 1rem; font-weight: 700; }
        .cap-name { color: var(--gold) !important; }

        #loader { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="loader">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
        <p style="color:var(--text-dim); margin-top:15px; font-size:0.7rem;">SYNCING TEAM PROTOCOL...</p>
    </div>

    <div class="container">
        <div class="back-nav"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> BACK</a></div>

        <div id="content" style="display: none;">
            <!-- HEADER -->
            <div class="header-card">
                <div class="t-logo-frame"><img id="tLogo" src=""></div>
                <div class="header-info">
                    <span>TEAM PROFILE</span>
                    <h1 id="tName">TEAM</h1>
                    <p id="playerCount">0 players</p>
                    <div class="title-summary"><i class="fa-solid fa-trophy"></i> <span id="titleSummaryText">0 Titles</span></div>
                </div>
            </div>

            <!-- ANALYTICS -->
            <div class="stats-grid">
                <div class="stat-card"><span class="stat-num" id="statLeague">0</span><span class="stat-label">League</span></div>
                <div class="stat-card"><span class="stat-num" id="statChampions">0</span><span class="stat-label">Cup</span></div>
            </div>

            <!-- WIN RATE -->
            <div class="win-rate-card">
                <span class="wr-perc" id="wrPerc">0%</span>
                <span style="display:block; font-size:0.8rem; margin:5px 0;">Calculated Win Rate</span>
                <span id="wrRecord" style="font-size:0.7rem; color:var(--text-dim)">0W • 0D • 0L</span>
            </div>

            <!-- CABINET -->
            <div class="cabinet-card">
                <div class="cabinet-header">
                    <h3>Trophy Cabinet</h3>
                    <div style="text-align:right"><b id="totalTitles" style="color:var(--gold); font-size:1.5rem;">0</b><br><small>TITLES</small></div>
                </div>
                <div class="trophy-stage"><img src="https://i.postimg.cc/15phyzFD/259302-removebg-preview.png" class="main-trophy-img"></div>
                <div id="trophyList"></div>
            </div>

            <!-- ROSTER LIST -->
            <div class="roster-card" id="playerList"></div>
        </div>
    </div>

    <script>
        const API = "https://pes-park-backend.onrender.com";
const teamId = new URLSearchParams(window.location.search).get('id');

async function init() {
    if (!teamId) {
        document.getElementById('loader').innerHTML = "ERROR: No Team ID provided.";
        return;
    }

    try {
        const res = await fetch(`${API}/api/teams/profile-by-id/${teamId}`);
        
        // Check if the response is actually JSON
        if (!res.ok) throw new Error("API Route not found on Server");
        
        const data = await res.json();

        // 1. Set Header
        document.getElementById('tName').innerText = data.team.name;
        document.getElementById('tLogo').src = data.team.logo || data.team.logoUrl;
        document.getElementById('playerCount').innerText = `${data.players.length} Players Registered`;
        document.getElementById('titleSummaryText').innerText = `${data.trophies.length} Titles`;

        // 2. Win Rate Calculation
        let w=0, d=0, l=0;
        data.matches.forEach(m => {
            const isA = m.playerA === data.team.name;
            const myS = isA ? m.scoreA : m.scoreB;
            const oppS = isA ? m.scoreB : m.scoreA;
            if(myS > oppS) w++; else if(myS === oppS) d++; else l++;
        });
        const total = data.matches.length;
        document.getElementById('wrPerc').innerText = (total > 0 ? Math.round((w/total)*100) : 0) + "%";
        document.getElementById('wrRecord').innerText = `${w}W • ${d}D • ${l}L`;

        // 3. Trophies
        document.getElementById('statLeague').innerText = data.trophies.length;
        document.getElementById('trophyList').innerHTML = data.trophies.map(t => 
            `<div class="trophy-pill">${t.title} - ${t.season}</div>`
        ).join('');

        // 4. Roster List (Image 1 Style)
        document.getElementById('playerList').innerHTML = data.players.map((p, i) => {
            const isCap = p.isCaptain || false;
            return `
                <a href="player.html?id=${p._id}" class="player-row">
                    <div class="rank-circle ${isCap ? 'cap-gold' : ''}">
                        ${isCap ? '<i class="fa-solid fa-crown"></i>' : (i + 1)}
                    </div>
                    <img src="${p.image || 'https://via.placeholder.com/50'}" class="p-avatar">
                    <div class="p-info">
                        <h3 class="${isCap ? 'cap-name' : ''}">${p.name} ${isCap ? '<span>• Captain</span>' : ''}</h3>
                        <p>"${p.nickname || p.name}"</p>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="color:var(--border); font-size:0.7rem;"></i>
                </a>
            `;
        }).join('');

        // Show Content
        document.getElementById('loader').style.display = 'none';
        document.getElementById('content').style.display = 'block';

    } catch (e) {
        console.error(e);
        document.getElementById('loader').innerHTML = `
            <div style="text-align:center; padding:20px;">
                <i class="fa-solid fa-circle-exclamation fa-2x" style="color:#ef4444; margin-bottom:10px;"></i>
                <br><b>ERROR: Team Link Broken</b>
                <p style="font-size:0.7rem; color:#64748b; margin-top:10px;">
                    This usually means the Backend Route is missing.<br>
                    Please update your server.js file.
                </p>
            </div>`;
    }
}

init();
    </script>
</body>
</html>
