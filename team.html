<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Command | NEXUS LEGENDS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg: #060b13;
            --card: #101926;
            --border: #1e293b;
            --accent: #10b981;
            --gold: #f59e0b;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 60px;
        }

        .container { max-width: 500px; margin: auto; }

        /* --- NAVIGATION --- */
        .back-nav { margin-bottom: 20px; }
        .back-nav a { color: var(--text-dim); text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 1rem; }

        /* --- HEADER CARD (IMAGE 1 STYLE) --- */
        .header-card {
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 25px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .t-logo-frame {
            width: 85px; height: 85px;
            border-radius: 18px; overflow: hidden;
            background: #000; border: 1px solid var(--border);
        }
        .t-logo-frame img { width: 100%; height: 100%; object-fit: contain; }
        .header-info span { color: var(--text-dim); font-size: 0.65rem; letter-spacing: 2px; font-weight: bold; }
        .header-info h1 { margin: 2px 0; font-size: 1.6rem; font-family: 'Orbitron'; text-transform: uppercase; }
        .header-info p { margin: 0; color: var(--text-dim); font-size: 0.85rem; }
        .title-summary { color: var(--gold); font-weight: bold; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; margin-top: 5px; }

        /* --- STATS GRID (IMAGE 2 STYLE) --- */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 15px; text-align: center; }
        .stat-num { display: block; font-size: 1.5rem; font-weight: 800; color: var(--accent); font-family: 'Orbitron'; }
        .stat-label { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        /* --- WIN RATE BOX --- */
        .win-rate-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 25px; }
        .wr-perc { font-size: 2rem; font-weight: 900; color: var(--accent); font-family: 'Orbitron'; }
        .wr-label { font-size: 0.8rem; color: white; display: block; margin: 2px 0; }
        .wr-record { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 1px; }

        /* --- TROPHY CABINET (IMAGE 2 STYLE) --- */
        .cabinet-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 25px; }
        .cabinet-header { display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--gold); padding-left: 12px; margin-bottom: 20px; }
        .cabinet-header h3 { margin: 0; font-size: 0.85rem; text-transform: uppercase; }
        .total-titles-big { text-align: right; }
        .total-titles-big b { font-size: 1.6rem; color: var(--gold); display: block; line-height: 1; }
        .total-titles-big span { font-size: 0.55rem; color: var(--text-dim); text-transform: uppercase; }
        
        .trophy-stage { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 25px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(245, 158, 11, 0.1); }
        .main-trophy-img { width: 55px; filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.3)); }
        
        .trophy-pill-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .trophy-pill { background: rgba(16, 185, 129, 0.05); border: 1px solid var(--accent); color: var(--accent); padding: 5px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: bold; }

        /* --- SEASON HISTORY TABLE --- */
        .section-title { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; font-weight: 800; padding-left: 5px; }
        .history-card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 25px; }
        .history-table { width: 100%; border-collapse: collapse; }
        .history-table th { background: rgba(255,255,255,0.02); text-align: left; padding: 12px; font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        .history-table td { padding: 14px 12px; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .pos-badge { background: var(--gold); color: black; padding: 2px 8px; border-radius: 4px; font-weight: 800; font-size: 0.7rem; }
        .win-badge { border: 1px solid var(--gold); color: var(--gold); padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; }

        /* --- ROSTER LIST (IMAGE 1 STYLE) --- */
        .roster-card { background: var(--card); border-radius: 24px; border: 1px solid var(--border); overflow: hidden; }
        .player-row {
            display: flex; align-items: center; padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.03); text-decoration: none; color: inherit;
        }
        .player-row:last-child { border-bottom: none; }
        .rank-circle {
            width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: bold; color: var(--text-dim); margin-right: 15px;
        }
        .rank-circle.cap-gold { background: rgba(245, 158, 11, 0.1); border-color: var(--gold); color: var(--gold); }
        .p-avatar { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: #000; margin-right: 15px; }
        .p-info { flex: 1; }
        .p-info h3 { margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: 0.5px; }
        .p-info h3 span { color: var(--text-dim); font-size: 0.75rem; font-weight: 400; margin-left: 6px; }
        .p-info p { margin: 2px 0 0; color: var(--text-dim); font-size: 0.75rem; font-style: italic; }
        .cap-name { color: var(--gold) !important; }
        .chevron { color: #1e293b; font-size: 0.7rem; }

        #loader { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="loader">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
        <p style="color:var(--text-dim); margin-top:15px; letter-spacing:3px; font-size:0.7rem;">DECRYPTING TEAM DATA...</p>
    </div>

    <div class="container">
        <div class="back-nav"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> BACK</a></div>

        <div id="content" style="display: none;">
            <!-- 1. ROSTER HEADER -->
            <div class="header-card">
                <div class="t-logo-frame"><img id="tLogo" src=""></div>
                <div class="header-info">
                    <span>TEAM ROSTER</span>
                    <h1 id="tName">TEAM NAME</h1>
                    <p id="playerCount">0 players</p>
                    <div class="title-summary"><i class="fa-solid fa-trophy"></i> <span id="titleSummaryText">0 Titles</span></div>
                </div>
            </div>

            <!-- 2. ANALYTICS GRID -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-num" id="statLeague">0</span>
                    <span class="stat-label">Team League</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="statChampions">0</span>
                    <span class="stat-label">Champions Cup</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="statEuropa">0</span>
                    <span class="stat-label">Europa League</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="statRel">0</span>
                    <span class="stat-label">Relegations</span>
                </div>
            </div>

            <!-- 3. PERFORMANCE -->
            <div class="win-rate-card">
                <span class="wr-perc" id="wrPerc">0%</span>
                <span class="wr-label">Win Rate</span>
                <span class="wr-record" id="wrRecord">0W • 0D • 0L</span>
            </div>

            <!-- 4. TROPHY CABINET -->
            <div class="section-title">Trophy Cabinet</div>
            <div class="cabinet-card">
                <div class="cabinet-header">
                    <div>
                        <small style="color:var(--accent); font-size:0.5rem; letter-spacing:2px; font-weight:bold;">COMMUNITY HONORS</small>
                        <h3 id="cabinetTitle">Trophy Cabinet</h3>
                    </div>
                    <div class="total-titles-big">
                        <b id="totalTitles">0</b>
                        <span>Titles</span>
                    </div>
                </div>
                <div class="trophy-stage">
                    <img src="https://i.postimg.cc/15phyzFD/259302-removebg-preview.png" class="main-trophy-img">
                    <div style="color:var(--gold); font-size:0.6rem; font-weight:800; margin-top:10px; letter-spacing:2px;">LEGENDS CLASS</div>
                </div>
                <div class="trophy-pill-container" id="trophyList"></div>
            </div>

            <!-- 5. SEASON HISTORY -->
            <div class="section-title">Season History</div>
            <div class="history-card">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Season</th>
                            <th>League Pos</th>
                            <th>Tournament</th>
                        </tr>
                    </thead>
                    <tbody id="historyRows"></tbody>
                </table>
            </div>

            <!-- 6. DETAILED ROSTER LIST -->
            <div class="section-title">Team Squad</div>
            <div class="roster-card" id="playerList"></div>
        </div>
    </div>

    <script>
        const API = "https://pes-park-backend.onrender.com";
        const teamName = new URLSearchParams(window.location.search).get('id');

        async function init() {
            try {
                const res = await fetch(`${API}/api/teams/profile/${encodeURIComponent(teamName)}`);
                const data = await res.json();

                // HEADER
                document.getElementById('tName').innerText = data.team.name;
                document.getElementById('tLogo').src = data.team.logoUrl || data.team.logo;
                document.getElementById('playerCount').innerText = `${data.players.length} players`;
                document.getElementById('cabinetTitle').innerText = `${data.team.name}'s Cabinet`;

                // WIN RATE
                let w = 0, d = 0, l = 0;
                data.matches.forEach(m => {
                    const isA = m.playerA === teamName;
                    const myS = isA ? m.scoreA : m.scoreB;
                    const oppS = isA ? m.scoreB : m.scoreA;
                    if(myS > oppS) w++; else if(myS === oppS) d++; else l++;
                });
                const totalM = data.matches.length;
                document.getElementById('wrPerc').innerText = (totalM > 0 ? Math.round((w/totalM)*100) : 0) + "%";
                document.getElementById('wrRecord').innerText = `${w}W • ${d}D • ${l}L`;

                // TROPHIES & ANALYTICS
                const trophies = data.trophies || [];
                document.getElementById('titleSummaryText').innerText = `${trophies.length} Titles`;
                document.getElementById('totalTitles').innerText = trophies.length;
                
                document.getElementById('statLeague').innerText = trophies.filter(t => t.title.toLowerCase().includes('league')).length;
                document.getElementById('statChampions').innerText = trophies.filter(t => t.title.toLowerCase().includes('champion')).length;
                document.getElementById('statEuropa').innerText = trophies.filter(t => t.title.toLowerCase().includes('europa')).length;

                document.getElementById('trophyList').innerHTML = trophies.map(t => `<div class="trophy-pill">${t.title} - ${t.season}</div>`).join('');
                
                // HISTORY TABLE
                document.getElementById('historyRows').innerHTML = trophies.map(t => `
                    <tr>
                        <td><b>${t.season}</b></td>
                        <td><span class="pos-badge">1st</span></td>
                        <td><span class="win-badge">Winner</span></td>
                    </tr>
                `).join('') || '<tr><td colspan="3" style="text-align:center; color:var(--text-dim)">No history recorded</td></tr>';

                // ROSTER LIST (NUMBERED + CROWN)
                document.getElementById('playerList').innerHTML = data.players.map((p, i) => {
                    const isCap = p.isCaptain || false;
                    return `
                        <a href="player.html?id=${p._id}" class="player-row">
                            <div class="rank-circle ${isCap ? 'cap-gold' : ''}">
                                ${isCap ? '<i class="fa-solid fa-crown"></i>' : (i + 1)}
                            </div>
                            <img src="${p.image || 'https://via.placeholder.com/50'}" class="p-avatar">
                            <div class="p-info">
                                <h3 class="${isCap ? 'cap-name' : ''}">${p.name} ${isCap ? '<span>Captain</span>' : ''}</h3>
                                <p>"${p.nickname || p.name}"</p>
                            </div>
                            <div class="chevron"><i class="fa-solid fa-chevron-right"></i></div>
                        </a>
                    `;
                }).join('');

                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (e) {
                console.error(e);
                document.getElementById('loader').innerHTML = "Database Link Failed.";
            }
        }

        if(teamName) init();
    </script>
</body>
</html>
