<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Roster | NEXUS LEGENDS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg: #060b13;
            --card: #101926;
            --border: #1e293b;
            --accent: #10b981;
            --gold: #f59e0b;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Top Nav */
        .back-nav {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- TEAM HEADER CARD --- */
        .header-card {
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 30px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .t-logo-frame {
            width: 90px;
            height: 90px;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border);
        }
        .t-logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-info span {
            color: var(--text-dim);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .header-info h1 {
            margin: 5px 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .header-info p {
            margin: 0;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        /* --- PLAYER LIST SECTION --- */
        .roster-card {
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
            overflow: hidden;
            padding: 10px 0;
        }

        .player-row {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .player-row:last-child { border-bottom: none; }
        .player-row:hover { background: rgba(255,255,255,0.02); }

        /* Rank Circle / Crown */
        .rank-indicator {
            width: 35px;
            min-width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-dim);
            margin-right: 15px;
        }
        .rank-indicator.is-cap {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Avatar */
        .p-avatar {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--bg);
            margin-right: 15px;
        }

        /* Names & Motto */
        .p-info { flex: 1; }
        .p-info h3 { margin: 0; font-size: 1rem; font-weight: 700; }
        .p-info h3 span { color: var(--text-dim); font-size: 0.8rem; font-weight: 400; margin-left: 5px; }
        .p-info p { margin: 3px 0 0; color: var(--text-dim); font-size: 0.75rem; font-style: italic; opacity: 0.8; }
        
        .cap-text { color: var(--gold) !important; }

        /* Right Arrow */
        .chevron { color: var(--border); font-size: 0.7rem; }

        #loading { text-align: center; padding: 100px; color: var(--text-dim); }
    </style>
</head>
<body>

    <div class="container">
        <div class="back-nav">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back</a>
        </div>

        <div id="content" style="display: none;">
            <!-- HEADER SECTION -->
            <div class="header-card">
                <div class="t-logo-frame">
                    <img id="tLogo" src="">
                </div>
                <div class="header-info">
                    <span>TEAM ROSTER</span>
                    <h1 id="tName">TEAM NAME</h1>
                    <p id="playerCount">0 players</p>
                </div>
            </div>

            <!-- ROSTER SECTION -->
            <div class="roster-card" id="playerList">
                <!-- Players will be injected here -->
            </div>
        </div>

        <div id="loading">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
            <p>SYNCING ROSTER...</p>
        </div>
    </div>

    <script>
        const API = "https://pes-park-backend.onrender.com";
        const teamParam = new URLSearchParams(window.location.search).get('id');
        const teamName = decodeURIComponent(teamParam);

        async function loadTeam() {
            try {
                const res = await fetch(`${API}/api/teams/profile/${encodeURIComponent(teamName)}`);
                const data = await res.json();

                if (!data.team) {
                    document.getElementById('loading').innerHTML = "Team not found.";
                    return;
                }

                // Header Info
                document.getElementById('tName').innerText = data.team.name;
                document.getElementById('tLogo').src = data.team.logoUrl || data.team.logo || 'https://via.placeholder.com/100';
                document.getElementById('playerCount').innerText = `${data.players.length} players`;

                // Player List
                const players = data.players || [];
                document.getElementById('playerList').innerHTML = players.map((p, index) => {
                    const isCaptain = p.isCaptain || false;
                    const rankContent = isCaptain ? '<i class="fa-solid fa-crown"></i>' : (index + 1);
                    const motto = p.nickname ? `"${p.nickname}"` : `"${p.name}"`;

                    return `
                        <a href="player.html?id=${p._id}" class="player-row">
                            <div class="rank-indicator ${isCaptain ? 'is-cap' : ''}">
                                ${rankContent}
                            </div>
                            <img src="${p.image || 'https://via.placeholder.com/50'}" class="p-avatar" onerror="this.src='https://via.placeholder.com/50'">
                            <div class="p-info">
                                <h3 class="${isCaptain ? 'cap-text' : ''}">
                                    ${p.name} ${isCaptain ? '<span>Captain</span>' : ''}
                                </h3>
                                <p>${motto}</p>
                            </div>
                            <div class="chevron"><i class="fa-solid fa-chevron-right"></i></div>
                        </a>
                    `;
                }).join('');

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = "Error loading database link.";
            }
        }

        if (teamParam) loadTeam();
        else document.getElementById('loading').innerHTML = "No team selected.";
    </script>
</body>
</html>
