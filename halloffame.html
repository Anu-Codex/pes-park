<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame | PES PARK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --bg: #060b13; --card: #101926; --accent: #10b981; --gold: #f59e0b; --border: #1e293b; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        .back-btn { color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        
        /* Header */
        .hof-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 30px 20px; text-align: center; margin-bottom: 20px; }
        .hof-card i { color: var(--gold); font-size: 2.5rem; margin-bottom: 10px; }
        .hof-card h1 { margin: 0; font-size: 2rem; }

        /* Highlights (Yellow Area Top) */
        .highlight-box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 10px 20px; margin-bottom: 20px; }
        .h-item { padding: 15px 0; border-bottom: 1px solid var(--border); }
        .h-item:last-child { border-bottom: none; }
        .h-label { color: var(--accent); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .h-val { font-size: 0.95rem; font-weight: 500; }

        /* Season Selector (Purple Area) */
        .season-nav { background: #0c121d; border: 1.5px solid var(--border); border-radius: 15px; padding: 5px 15px; margin-bottom: 20px; }
        .season-nav select { width: 100%; background: transparent; border: none; color: white; padding: 10px 0; outline: none; font-size: 1rem; }

        /* Trophies (Yellow Area Bottom) */
        .trophy-section { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 20px; }
        .t-row { display: flex; align-items: center; gap: 20px; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .t-icon { width: 40px; height: 40px; object-fit: contain; }
        .t-info .t-title { color: #64748b; font-size: 0.7rem; display: block; }
        .t-info .t-name { font-size: 1.1rem; font-weight: bold; color: white; }
        .t-info .t-squad { font-size: 0.7rem; color: #475569; display: block; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>

        <div class="hof-card">
            <i class="fa-solid fa-crown"></i>
            <h1>Hall of Fame</h1>
            <p style="color:#94a3b8; font-size:0.8rem">PES PARK League • Season History</p>
        </div>

        <div id="highlights-container" class="highlight-box"></div>

        <div class="season-nav">
            <select id="seasonSelect" onchange="loadSeasonData(this.value)">
                <!-- Seasons will load here -->
            </select>
        </div>

        <div class="trophy-section">
            <h3 style="margin:0 0 15px 0; font-size:0.9rem; color:#94a3b8">Trophy Winners</h3>
            <div id="trophies-container"></div>
        </div>
    </div>

    <script>
        const API = "https://pes-park-backend.onrender.com/api/hof";
        const icons = {
            ballon: "https://cdn-icons-png.flaticon.com/512/3112/3112946.png",
            league: "https://cdn-icons-png.flaticon.com/512/2618/2618068.png",
            ucl: "https://cdn-icons-png.flaticon.com/512/1163/1163474.png",
            weekly: "https://cdn-icons-png.flaticon.com/512/1435/1435345.png"
        };

        async function init() {
            const res = await fetch(`${API}/seasons`);
            const seasons = await res.json();
            const sel = document.getElementById('seasonSelect');
            sel.innerHTML = seasons.map(s => `<option value="${s.seasonName}">${s.seasonName}</option>`).join('');
            if(seasons.length > 0) loadSeasonData(seasons[0].seasonName);
        }

        async function loadSeasonData(name) {
    const contentHighlight = document.getElementById('highlights-container');
    const contentTrophies = document.getElementById('trophies-container');

    try {
        const res = await fetch(`${API}/hof/data/${encodeURIComponent(name)}`);
        const data = await res.json();

        if (!data) return;

        // 1. Render Special Highlights (Top Yellow Area)
        contentHighlight.innerHTML = data.specialHighlights.map(h => `
            <div class="h-item">
                <span class="h-label">${h.label}</span>
                <span class="h-val">${h.value}</span>
            </div>
        `).join('');

        // 2. Render Trophy Winners (Bottom Yellow Area)
        // Note: Using a generic trophy icon if none provided
        contentTrophies.innerHTML = data.trophyWinners.map(t => `
            <div class="t-row">
                <img src="https://cdn-icons-png.flaticon.com/512/3112/3112946.png" class="t-icon">
                <div class="t-info">
                    <span class="t-title">${t.title}</span>
                    <span class="t-name">${t.winner}</span>
                </div>
            </div>
        `).join('');

    } catch (err) {
        console.error("HOF Display Error:", err);
    }
        }
    </script>
</body>
</html>
