<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame | Tamil Efootballers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg: #030712;
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.3);
            --card-bg: #111827;
            --text-dim: #9ca3af;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Nav Re-used */
        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .top-nav { display: flex; gap: 15px; }
        .nav-item { color: var(--text-dim); font-size: 20px; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 12px; text-decoration: none; transition: 0.3s; }
        .nav-item.active { background: rgba(245, 158, 11, 0.1); color: var(--gold); border: 1px solid var(--gold-glow); }

        /* Hero Section */
        .hero { text-align: center; margin-bottom: 50px; }
        .hero h1 { font-size: 2.5rem; margin: 0; background: linear-gradient(to bottom, #fff, #9ca3af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--gold); letter-spacing: 2px; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }

        /* Grid */
        .hof-grid { width: 100%; max-width: 600px; display: grid; gap: 20px; }

        .hof-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid #1f2937;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .hof-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 10px 30px var(--gold-glow); }

        .winner-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; }

        .info h3 { margin: 0; font-size: 1.2rem; }
        .info p { margin: 5px 0; color: var(--text-dim); font-size: 0.9rem; }
        .season-tag { background: var(--gold); color: black; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 900; }

        .trophy-icon { position: absolute; right: -10px; bottom: -10px; font-size: 5rem; color: rgba(245, 158, 11, 0.05); transform: rotate(-15deg); }

        #loading { color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><h2>Tamil</h2></div>
        <nav class="top-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-chart-simple"></i></a>
            <a href="halloffame.html" class="nav-item active"><i class="fa-solid fa-trophy"></i></a>
            <a href="login.html" class="nav-item"><i class="fa-solid fa-right-to-bracket"></i></a>
        </nav>
    </div>

    <div class="hero">
        <p>Prestige & History</p>
        <h1>Hall of Fame</h1>
    </div>

    <div id="loading">Gathering Legends...</div>
    <div class="hof-grid" id="hofGrid"></div>

    <script>
        const API = "https://pes-park-backend.onrender.com"; // Replace with your Render URL

        async function loadHOF() {
            try {
                const res = await fetch(`${API}/api/achievements`);
                const data = await res.json();
                document.getElementById('loading').style.display = 'none';

                const grid = document.getElementById('hofGrid');
                grid.innerHTML = data.map(ach => `
                    <div class="hof-card">
                        <img src="${ach.winnerImage || 'https://via.placeholder.com/80'}" class="winner-img">
                        <div class="info">
                            <span class="season-tag">${ach.season}</span>
                            <h3>${ach.winnerName}</h3>
                            <p>${ach.title} • ${ach.teamName}</p>
                        </div>
                        <i class="fa-solid fa-trophy trophy-icon"></i>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('loading').innerText = "Error loading legends.";
            }
        }
        loadHOF();
    </script>
</body>
</html>
