<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | PES PARK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg: #030712;
            --card-bg: #0f172a;
            --border: #1e293b;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --win: #10b981;
            --loss: #ef4444;
            --draw: #f59e0b;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }

        /* Top Navigation */
        .top-nav {
            display: flex;
            align-items: center;
            padding: 10px 0 20px;
        }

        .back-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Main Card Layout */
        .glass-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* Header Info */
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .p-avatar { 
            width: 70px; height: 70px; border-radius: 16px; 
            background: #1e293b; border: 1.5px solid var(--border);
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
        }
        .p-name-area h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; }
        .p-name-area p { margin: 4px 0 0; color: var(--text-dim); font-size: 0.9rem; }

        /* Stats Row */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .stat-box { 
            background: #020617; border: 1px solid var(--border); 
            padding: 12px 5px; border-radius: 12px; text-align: center; 
        }
        .stat-box span { display: block; font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
        .stat-box b { font-size: 1.2rem; color: white; }

        /* Match History List */
        .section-title { font-size: 1rem; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .section-title small { font-size: 0.7rem; color: var(--text-dim); font-weight: normal; }

        .match-row {
            display: flex; align-items: center; 
            padding: 12px 0; border-bottom: 1px solid #1e293b;
        }
        .match-row:last-child { border-bottom: none; }
        
        .m-date { font-size: 0.75rem; color: var(--text-dim); width: 45px; }
        .m-opp { flex: 1; font-size: 0.9rem; font-weight: 500; }
        .m-score { background: #1e293b; padding: 3px 8px; border-radius: 6px; margin: 0 10px; font-weight: bold; font-size: 0.85rem; }
        
        /* Result Badges */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; width: 45px; text-align: center; }
        .win { color: var(--win); border: 1px solid rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.1); }
        .loss { color: var(--loss); border: 1px solid rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.1); }
        .draw { color: var(--draw); border: 1px solid rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.1); }

        /* H2H Styling */
        .h2h-select {
            width: 100%; padding: 14px; background: #020617; color: white;
            border: 1px solid var(--border); border-radius: 12px; font-size: 0.9rem; outline: none;
        }
        .h2h-stats-view {
            display: flex; justify-content: space-around; margin-top: 20px;
            animation: fadeIn 0.4s ease;
        }
        .h2h-val { font-size: 1.8rem; font-weight: 800; display: block; margin-bottom: 2px; }
        .h2h-label { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 1px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="index.html" class="back-link"><i class="fa-solid fa-chevron-left"></i> Back</a>
    </nav>

    <div id="loading" style="text-align: center; color: var(--text-dim); padding: 50px;">
        <i class="fa-solid fa-circle-notch fa-spin"></i> Synchronizing Profile...
    </div>

    <div id="playerContent" style="display: none;">
        <!-- Card 1: Header & Top Stats -->
        <div class="glass-card">
            <div class="profile-header">
                <div id="avatarBox" class="p-avatar"></div>
                <div class="p-name-area">
                    <h1 id="pName">---</h1>
                    <p id="pNick">"---"</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box"><span>Auction</span><b id="pAuction">0</b></div>
                <div class="stat-box"><span>Market</span><b id="pMarket" style="color: var(--win);">0</b></div>
                <div class="stat-box"><span>BDR</span><b id="pBDR">0</b></div>
            </div>
        </div>

        <!-- Card 2: Match History -->
        <div class="glass-card">
            <div class="section-title">
                Match history <small id="matchTotal">Showing last 5</small>
            </div>
            <div id="historyList"></div>
        </div>

        <!-- Card 3: Head to Head -->
        <div class="glass-card">
            <div class="section-title">Head-to-head record</div>
            <select id="h2hSelector" class="h2h-select" onchange="calcH2H()">
                <option value="">Select an opponent...</option>
            </select>

            <div id="h2hDisplay" class="h2h-stats-view" style="display: none;">
                <div style="text-align: center;"><span class="h2h-val" id="hWins" style="color: var(--win);">0</span><span class="h2h-label">WINS</span></div>
                <div style="text-align: center;"><span class="h2h-val" id="hDraws" style="color: var(--draw);">0</span><span class="h2h-label">DRAWS</span></div>
                <div style="text-align: center;"><span class="h2h-val" id="hLoss" style="color: var(--loss);">0</span><span class="h2h-label">LOSSES</span></div>
            </div>
            <p id="h2hPlaceholder" style="text-align: center; color: var(--text-dim); font-size: 0.8rem; padding: 20px 0 10px;">Select opponent to view records</p>
        </div>
    </div>

    <script>
        const API = "https://pes-park-backend.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('id');

        let matches = [];

        async function getProfile() {
            try {
                const res = await fetch(`${API}/api/players/${playerId}`);
                const p = await res.json();
                matches = p.matches || [];

                // Fill Header
                document.getElementById('pName').innerText = p.name;
                document.getElementById('pNick').innerText = `"${p.nickname}"`;
                document.getElementById('pAuction').innerText = p.auctionPrice || 0;
                document.getElementById('pMarket').innerText = p.marketValue || 0;
                document.getElementById('pBDR').innerText = p.bdrPoints || 0;
                
                const avatar = document.getElementById('avatarBox');
                if(p.image) avatar.innerHTML = `<img src="${p.image}" style="width:100%; height:100%; border-radius:14px; object-fit:cover;">`;
                else avatar.innerHTML = `<i class="fa-solid fa-user"></i>`;

                // Fill Match List
                const list = document.getElementById('historyList');
                if(matches.length > 0) {
                    list.innerHTML = matches.slice(0, 5).map(m => {
                        const date = new Date(m.date).toLocaleDateString('en-GB', {day:'2-digit', month:'short'});
                        return `
                            <div class="match-row">
                                <div class="m-date">${date}</div>
                                <div class="m-opp">vs ${m.opponentName}</div>
                                <div class="m-score">${m.myScore}-${m.oppScore}</div>
                                <div class="badge ${m.result.toLowerCase()}">${m.result}</div>
                            </div>
                        `;
                    }).join('');
                } else {
                    list.innerHTML = '<p style="text-align:center; color:var(--text-dim); font-size:0.8rem;">No match records found.</p>';
                }

                // Fill H2H Selector
                const opps = [...new Set(matches.map(m => m.opponentName))];
                document.getElementById('h2hSelector').innerHTML += opps.map(o => `<option value="${o}">${o}</option>`).join('');

                // Toggle View
                document.getElementById('loading').style.display = 'none';
                document.getElementById('playerContent').style.display = 'block';

            } catch (err) {
                document.getElementById('loading').innerHTML = '<span style="color:red">Failed to load profile.</span>';
            }
        }

        function calcH2H() {
            const opp = document.getElementById('h2hSelector').value;
            const view = document.getElementById('h2hDisplay');
            const placeholder = document.getElementById('h2hPlaceholder');

            if(!opp) { view.style.display = 'none'; placeholder.style.display = 'block'; return; }

            const filtered = matches.filter(m => m.opponentName === opp);
            document.getElementById('hWins').innerText = filtered.filter(m => m.result === "WIN").length;
            document.getElementById('hDraws').innerText = filtered.filter(m => m.result === "DRAW").length;
            document.getElementById('hLoss').innerText = filtered.filter(m => m.result === "LOSS").length;

            view.style.display = 'flex';
            placeholder.style.display = 'none';
        }

        getProfile();
    </script>
</body>
</html>
