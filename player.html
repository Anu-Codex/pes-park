<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Player Profile | Tamil Efootballers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --bg: #060b13; --card: #101926; --accent: #10b981; --border: #1e293b; }
        body { background: var(--bg); color: white; font-family: sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .back-btn { color: #94a3b8; text-decoration: none; display: block; margin-bottom: 20px; }
        
        /* Profile Header */
        .profile-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
        .header-top { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
        .avatar-lg { width: 80px; height: 80px; background: #1e293b; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        
        /* Stats Grid */
        .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .stat-item { background: #060b13; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .stat-item span { font-size: 0.7rem; color: #64748b; display: block; }
        .stat-item b { font-size: 1.2rem; display: block; margin-top: 5px; }

        /* Match History */
        .history-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        .match-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #1e293b; }
        .win { color: #10b981; font-weight: bold; }
        .loss { color: #ef4444; font-weight: bold; }
        
        /* Squad Image */
        .squad-box img { width: 100%; border-radius: 15px; border: 1px solid var(--border); }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; width: 60px; text-align: center; }
    .badge.win { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid #10b981; }
    .badge.loss { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
    .badge.draw { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>

        <div id="profileContent">Loading Profile...</div>
    </div>
    <!-- Match History Section -->
<div class="history-card">
    <div style="display:flex; justify-content:space-between">
        <h3>Match history</h3>
        <span style="color:#64748b; font-size:0.8rem" id="matchCount">Showing last 5 matches</span>
    </div>
    <div id="matchHistoryList"></div>
</div>

<!-- Head to Head Section -->
<div class="history-card">
    <h3><i class="fa-solid fa-swords"></i> Head-to-head record</h3>
    <select id="h2hSelector" onchange="calculateH2H()" style="width:100%; padding:12px; background:#060b13; border:1px solid #1e293b; color:white; border-radius:10px;">
        <option value="">Select opponent...</option>
    </select>
    
    <div id="h2hDisplay" style="margin-top:20px; display:none; text-align:center;">
        <div class="stats-row">
            <div class="stat-item"><span id="h2hWins" style="color:#10b981">0</span><b>WINS</b></div>
            <div class="stat-item"><span id="h2hDraws" style="color:gold">0</span><b>DRAWS</b></div>
            <div class="stat-item"><span id="h2hLoss" style="color:#ef4444">0</span><b>LOSSES</b></div>
        </div>
    </div>
    <p id="h2hEmpty" style="color:#64748b; text-align:center; padding:20px;">Select an opponent to view head-to-head records</p>
</div>


    <script>
        const API = "https://pes-park-backend.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('id');

        async function loadProfile() {
            const res = await fetch(`${API}/api/players/${playerId}`);
            const p = await res.json();

            document.getElementById('profileContent').innerHTML = `
                <div class="profile-card">
                    <div class="header-top">
                        <div class="avatar-lg"><i class="fa-solid fa-user"></i></div>
                        <div>
                            <h1 style="margin:0">${p.name}</h1>
                            <p style="color:#94a3b8; margin:5px 0">"${p.nickname}"</p>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item"><span>Auction Price</span><b>${p.auctionPrice}</b></div>
                        <div class="stat-item"><span>Market Value</span><b style="color:gold">${p.marketValue}</b></div>
                        <div class="stat-item"><span>BDR Points</span><b>${p.bdrPoints}</b></div>
                    </div>
                </div>

                <div class="history-card">
                    <h3 style="margin-top:0">Match history</h3>
                    ${p.matchHistory.map(m => `
                        <div class="match-row">
                            <span style="color:#64748b">${m.date}</span>
                            <span>vs ${m.opponent} <b style="background:#1e293b; padding:2px 6px; border-radius:4px">${m.score}</b></span>
                            <span class="${m.result.toLowerCase()}">${m.result}</span>
                        </div>
                    `).join('')}
                </div>

                <div class="history-card">
                    <h3>Player squad</h3>
                    <div class="squad-box">
                        <img src="${p.squadImage || 'https://via.placeholder.com/400x200'}">
                    </div>
                </div>
            `;
        }
        loadProfile();
        let currentPlayerMatches = [];

    async function loadProfile() {
        const res = await fetch(`${API}/api/players/${playerId}`);
        const p = await res.json();
        currentPlayerMatches = p.matches;

        // 1. Render Match History
        document.getElementById('matchHistoryList').innerHTML = p.matches.slice(0, 5).map(m => `
            <div class="match-row">
                <span style="color:#475569; width:50px;">${m.date}</span>
                <span style="flex:1">vs ${m.opponentName} <b style="background:#1e293b; padding:2px 8px; border-radius:5px; margin-left:10px">${m.myScore}-${m.oppScore}</b></span>
                <span class="badge ${m.result.toLowerCase()}">${m.result}</span>
            </div>
        `).join('');

        // 2. Fill H2H Selector with unique opponents from history
        const opponents = [...new Set(p.matches.map(m => m.opponentName))];
        document.getElementById('h2hSelector').innerHTML += opponents.map(opp => `<option value="${opp}">${opp}</option>`).join('');
    }

    function calculateH2H() {
        const selectedOpp = document.getElementById('h2hSelector').value;
        const display = document.getElementById('h2hDisplay');
        const empty = document.getElementById('h2hEmpty');

        if(!selectedOpp) {
            display.style.display = "none";
            empty.style.display = "block";
            return;
        }

        const filtered = currentPlayerMatches.filter(m => m.opponentName === selectedOpp);
        
        const wins = filtered.filter(m => m.result === "WIN").length;
        const draws = filtered.filter(m => m.result === "DRAW").length;
        const losses = filtered.filter(m => m.result === "LOSS").length;

        document.getElementById('h2hWins').innerText = wins;
        document.getElementById('h2hDraws').innerText = draws;
        document.getElementById('h2hLoss').innerText = losses;

        display.style.display = "block";
        empty.style.display = "none";
    }
    </script>
</body>
</html>
