<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dressing Room | NEXUS LEGENDS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --bg: #020617;
            --panel: #0f172a;
            --accent: #10b981;
            --gold: #f59e0b;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #020617 80%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- TOP NAVIGATION --- */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            border: 1px solid var(--danger);
            transition: 0.3s;
        }

        .logout-btn:hover { background: var(--danger); color: white; }

        /* --- HERO SECTION --- */
        .hero {
            display: flex;
            align-items: center;
            gap: 25px;
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.1) 0%, transparent 100%);
            padding: 30px;
            border-radius: 20px;
            border-left: 4px solid var(--accent);
            margin-bottom: 30px;
        }

        .t-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.4));
            background: var(--panel);
            padding: 10px;
            border-radius: 50%;
            border: 2px solid var(--border);
        }

        .hero-text h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-text p {
            color: var(--text-dim);
            margin: 5px 0 0 0;
            font-weight: 500;
        }

        /* --- STATS GRID --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--panel);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
        }

        .stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.8rem; font-weight: 900; color: var(--text-main); font-family: 'Orbitron', sans-serif; }
        .stat-value span { font-size: 1rem; color: var(--accent); margin-left: 5px; }

        /* --- MAIN LAYOUT SPACING --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

        /* --- PANELS --- */
        .panel {
            background: var(--panel);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 25px;
            margin-bottom: 25px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .panel-header i { color: var(--accent); }
        .panel-header h3 { margin: 0; font-family: 'Orbitron'; font-size: 1rem; letter-spacing: 1px; }

        /* --- TABLE STYLE --- */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; padding: 10px; border-bottom: 2px solid var(--border); }
        td { padding: 15px 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .p-name { font-weight: 700; color: var(--text-main); }
        .p-price { color: var(--gold); font-family: 'Orbitron'; font-size: 0.8rem; }
        .p-mv { color: var(--accent); font-family: 'Orbitron'; font-size: 0.8rem; }

        /* --- FORM ELEMENTS --- */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; }
        input, select {
            width: 100%;
            padding: 12px;
            background: #020617;
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
            outline: none;
            font-family: 'Rajdhani';
            transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

        .btn-publish {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #020617;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            font-family: 'Orbitron';
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-publish:hover { background: #059669; transform: translateY(-2px); }

        /* --- OFFERS LIST --- */
        .offer-card {
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid var(--gold);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .offer-card b { color: var(--gold); }
        .accept-btn {
            width: 100%; margin-top: 10px; background: var(--gold); color: #000;
            border: none; padding: 10px; border-radius: 6px; font-weight: 800;
            cursor: pointer; font-family: 'Orbitron'; font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div style="text-align:center;">
            <i class="fa-solid fa-rocket fa-spin fa-3x" style="color:var(--accent)"></i>
            <p style="margin-top:15px; font-size:0.8rem; color:var(--accent); letter-spacing:4px; font-family:'Orbitron';">INITIALIZING DRESSING ROOM...</p>
        </div>
    </div>

    <div class="container">
        <!-- TOP NAVIGATION -->
        <div class="top-nav">
            <span style="color:var(--accent); font-weight:700; letter-spacing:1px;">NEXUS LEGENDS <span style="color:white">PRO</span></span>
            <a href="captain-login.html" class="logout-btn"><i class="fa-solid fa-power-off"></i> LOGOUT</a>
        </div>

        <!-- HERO SECTION -->
        <div class="hero">
            <img id="tLogo" src="https://via.placeholder.com/100" class="t-logo">
            <div class="hero-text">
                <p>WELCOME BACK, MANAGER</p>
                <h1 id="displayName">LOADING TEAM...</h1>
            </div>
        </div>

        <!-- MANAGER DASHBOARD STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Transfer Budget</div>
                <div class="stat-value" id="tPurse">0<span>M</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Squad</div>
                <div class="stat-value" id="squadCount">0<span>Players</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Investment</div>
                <div class="stat-value" id="totalInvestment">0<span>M</span></div>
            </div>
        </div>

        <div class="dashboard-grid">
            
            <!-- LEFT: SQUAD LIST -->
            <div class="panel">
                <div class="panel-header">
                    <i class="fa-solid fa-users-rectangle"></i>
                    <h3>SQUAD MANAGEMENT</h3>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Player Name</th>
                            <th>Purchase Fee</th>
                            <th>Market Value</th>
                        </tr>
                    </thead>
                    <tbody id="squadDisplay">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- RIGHT: ACTIONS -->
            <div class="sidebar">
                
                <!-- INCOMING OFFERS (Dynamic) -->
                <div class="panel" id="offersBox" style="display:none; border: 1px solid var(--gold);">
                    <div class="panel-header">
                        <i class="fa-solid fa-envelope-open-text" style="color:var(--gold)"></i>
                        <h3 style="color:var(--gold)">PRIVATE OFFERS</h3>
                    </div>
                    <div id="incomingOffersList"></div>
                </div>

                <!-- TRANSFER MARKET MENU -->
                <div class="panel">
                    <div class="panel-header">
                        <i class="fa-solid fa-handshake"></i>
                        <h3>TRANSFER CENTER</h3>
                    </div>
                    
                    <div class="input-group">
                        <label>Select Player to Release/Trade</label>
                        <select id="playerList"></select>
                    </div>

                    <div class="input-group">
                        <label>Release Fee (M)</label>
                        <input type="number" id="fee" placeholder="0">
                    </div>

                    <div class="input-group">
                        <label>Special Terms (Add-ons)</label>
                        <input type="text" id="addons" placeholder="e.g. Friendly next week">
                    </div>

                    <div class="input-group">
                        <label>Target Team (Receiver)</label>
                        <select id="targetTeam">
                            <option value="General">Public Market (Everyone)</option>
                        </select>
                    </div>

                    <button class="btn-publish" onclick="publishListing()">
                        <i class="fa-solid fa-bullhorn"></i> Publish Listing
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "https://pes-park-backend.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const teamName = urlParams.get('id');
        const captainData = JSON.parse(localStorage.getItem('activeCaptainTeam'));

        setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; }, 3000);

        async function init() {
            if (!captainData || teamName !== captainData.teamName) {
                window.location.href = 'captain-login.html';
                return;
            }

            try {
                const res = await fetch(`${API}/api/teams/profile/${encodeURIComponent(teamName)}`);
                const data = await res.json();

                document.getElementById('displayName').innerText = data.team.name + " COMMAND";
                document.getElementById('tPurse').innerHTML = data.team.budget + "<span>M</span>";
                if(data.team.logoUrl) document.getElementById('tLogo').src = data.team.logoUrl;

                // Squad Stats Calculations
                let totalSpent = 0;
                document.getElementById('squadCount').innerHTML = data.players.length + "<span>Players</span>";

                // Populate Dropdown
                document.getElementById('playerList').innerHTML = data.players.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
                
                // Populate Professional Table
                document.getElementById('squadDisplay').innerHTML = data.players.map(p => {
                    const price = p.soldTo.match(/\d+/) ? p.soldTo.match(/\d+/)[0] : 0;
                    totalSpent += parseInt(price);
                    return `
                    <tr>
                        <td class="p-name">${p.name}</td>
                        <td class="p-price">${price}M</td>
                        <td class="p-mv">${p.marketValue || 0}M</td>
                    </tr>
                `}).join('');

                document.getElementById('totalInvestment').innerHTML = totalSpent + "<span>M</span>";

                loadOffers();

                // Populate Team Dropdown
                try {
                    const teamsRes = await fetch(`${API}/api/teams/all`);
                    const allTeams = await teamsRes.json();
                    const targetSelect = document.getElementById('targetTeam');
                    if (allTeams) {
                        targetSelect.innerHTML = '<option value="General">Public Market (Everyone)</option>';
                        allTeams.forEach(t => {
                            if (t.name !== teamName) {
                                const opt = document.createElement('option');
                                opt.value = t.name;
                                opt.innerText = t.name;
                                targetSelect.appendChild(opt);
                            }
                        });
                    }
                } catch (e) { console.log("Team list error"); }

            } catch (e) { console.log("Load failed"); }
            document.getElementById('loading-overlay').style.display = 'none';
        }

        async function loadOffers() {
            const res = await fetch(`${API}/api/market/listings`);
            const list = await res.json();
            const myOffers = list.filter(l => l.targetTeam === teamName || (l.targetTeam === "General" && l.fromTeam !== teamName));
            
            if(myOffers.length > 0) {
                document.getElementById('offersBox').style.display = 'block';
                document.getElementById('incomingOffersList').innerHTML = myOffers.map(o => `
                    <div class="offer-card">
                        <div style="font-size:0.8rem; margin-bottom:5px;"><b>${o.fromTeam}</b> sent offer for:</div>
                        <div style="font-weight:700; font-size:1.1rem; color:white;">${o.playerName}</div>
                        <div style="font-size:0.7rem; color:var(--text-dim); margin-top:5px;">Fee: ${o.releaseFee}M</div>
                        <button class="accept-btn" onclick="acceptOffer('${o._id}')">CONFIRM SIGNING (${o.releaseFee}M)</button>
                    </div>
                `).join('');
            }
        }

        async function acceptOffer(id) {
            if(!confirm("Are you sure you want to finalize this signing?")) return;
            const res = await fetch(`${API}/api/market/accept-offer`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ listingId: id, buyerTeamName: teamName })
            });
            if(res.ok) { alert("Transfer Complete! ✅"); location.reload(); }
            else { const err = await res.json(); alert(err.error); }
        }

        async function publishListing() {
            const feeInput = document.getElementById('fee').value;
            const playerInput = document.getElementById('playerList').value;
            const targetInput = document.getElementById('targetTeam').value;
            const addonsInput = document.getElementById('addons').value;

            if(!feeInput || !playerInput) return alert("Select player and fee!");

            const res = await fetch(`${API}/api/market/list-player`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    playerName: playerInput,
                    fromTeam: teamName,
                    releaseFee: feeInput,
                    addons: addonsInput,
                    targetTeam: targetInput
                })
            });
            
            if(res.ok) {
                alert("✅ Listing successfully published to the market!");
                location.reload();
            } else {
                alert("❌ Error: Check your purse balance or player status.");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
