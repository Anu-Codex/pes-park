<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dressing Room | PES PARK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --bg: #030712; --card: #0f172a; --accent: #10b981; --border: #1e293b; --danger: #ef4444; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }

        /* Header Card */
        .header-card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .t-logo { width: 50px; height: 50px; object-fit: contain; }
        .purse-val { font-size: 2rem; font-weight: 900; color: var(--accent); letter-spacing: -1px; }

        /* Listing Box */
        .sub-box { background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h4 { margin: 0 0 20px; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        
        label { font-size: 0.7rem; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; display: block; }
        input, select { width: 100%; padding: 14px; background: #020617; border: 1px solid var(--border); color: white; border-radius: 12px; margin-bottom: 15px; font-size: 0.9rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); }

        .btn-publish { width: 100%; padding: 16px; background: var(--accent); color: #020617; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Squad Item */
        .squad-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 15px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .p-img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header-card">
            <img id="tLogo" src="" class="t-logo">
            <div>
                <div style="font-size: 0.65rem; color: var(--text-dim);">REMAINING PURSE</div>
                <div class="purse-val" id="tPurse">0M</div>
            </div>
        </div>

        <!-- Listing Form -->
        <div class="sub-box">
            <h4><i class="fa-solid fa-paper-plane"></i> Transfer Market Listing</h4>
            
            <label>Select Player to Release</label>
            <select id="playerList"></select>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Release Fee (M)</label>
                    <input type="number" id="fee" placeholder="e.g. 50">
                </div>
                <div>
                    <label>Add-ons / Terms</label>
                    <input type="text" id="addons" placeholder="Optional">
                </div>
            </div>

            <label>Target Offer (Receiver)</label>
            <select id="targetTeam">
                <option value="General">Public Market (All Teams)</option>
            </select>

            <button class="btn-publish" onclick="publishListing()" id="pubBtn">Publish Listing</button>
        </div>

        <!-- Squad List -->
        <div class="sub-box">
            <h4><i class="fa-solid fa-users"></i> Current Squad</h4>
            <div id="squadDisplay"></div>
        </div>
        <!-- Incoming Offers Section -->
<div class="sub-box" id="offersBox" style="border-left: 4px solid var(--gold); display: none;">
    <h4><i class="fa-solid fa-bell-concierge"></i> Incoming Offers</h4>
    <div id="incomingOffersList">
        <!-- Offers will be injected here -->
    </div>
</div>
    </div>

    <script>
        const API = "https://pes-park-backend.onrender.com";
        const data = JSON.parse(localStorage.getItem('activeCaptainTeam'));

        if(!data) window.location.href = 'captain-login.html';

        function init() {
            document.getElementById('tLogo').src = data.logo;
            document.getElementById('tPurse').innerText = data.purse + "M";

            // Fill Squad
            document.getElementById('playerList').innerHTML = data.squad.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
            document.getElementById('squadDisplay').innerHTML = data.squad.map(p => `
                <div class="squad-item">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <img src="${p.imageUrl}" class="p-img">
                        <span style="font-weight:bold; font-size:0.9rem;">${p.name}</span>
                    </div>
                    <span style="color:var(--accent); font-weight:800;">${p.soldTo.match(/\d+/)}M</span>
                </div>
            `).join('');

            // Load Other Teams
            fetch(`${API}/api/teams/all`).then(r => r.json()).then(teams => {
                const sel = document.getElementById('targetTeam');
                teams.filter(t => t.name !== data.teamName).forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.name; opt.innerText = t.name;
                    sel.appendChild(opt);
                });
            });
        }

        async function publishListing() {
            const fee = document.getElementById('fee').value;
            if(!fee || fee <= 0) return alert("Please set a valid release fee.");
            if(fee > data.purse) return alert("Insufficient funds in purse!");

            const btn = document.getElementById('pubBtn');
            btn.innerText = "PUBLISHING...";
            btn.disabled = true;

            const payload = {
                playerName: document.getElementById('playerList').value,
                fromTeam: data.teamName,
                releaseFee: fee,
                addons: document.getElementById('addons').value,
                targetTeam: document.getElementById('targetTeam').value
            };

            const res = await fetch(`${API}/api/market/list-player`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                alert("✅ Success! Your player is now on the market.");
                location.reload();
            }
        }
        init();
// 1. Add this to your init() function to fetch offers sent to the logged-in captain
async function loadIncomingOffers() {
    const res = await fetch(`${API}/api/market/listings`);
    const allListings = await res.json();
    
    // Filter listings where target is "General" or specifically this team
    const myOffers = allListings.filter(l => 
        l.targetTeam === data.teamName || (l.targetTeam === "General" && l.fromTeam !== data.teamName)
    );

    const container = document.getElementById('incomingOffersList');
    if (myOffers.length > 0) {
        document.getElementById('offersBox').style.display = 'block';
        container.innerHTML = myOffers.map(o => `
            <div class="squad-item" style="border-color: var(--gold); background: rgba(245, 158, 11, 0.05); flex-direction:column; align-items:flex-start;">
                <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                    <div>
                        <span style="font-size:0.6rem; color:var(--gold); font-weight:bold;">OFFER FROM: ${o.fromTeam}</span>
                        <div style="font-weight:bold; font-size:1.1rem;">${o.playerName}</div>
                    </div>
                    <div style="text-align:right;">
                        <span style="font-size:0.6rem; color:var(--text-dim);">FEE</span>
                        <div style="font-size:1.2rem; font-weight:900; color:white;">${o.releaseFee}M</div>
                    </div>
                </div>
                <button onclick="acceptOffer('${o._id}')" style="width:100%; margin-top:10px; padding:8px; background:var(--gold); color:black; font-size:0.75rem; border-radius:8px;">
                    ACCEPT & TRANSFER
                </button>
            </div>
        `).join('');
    }
}

// 2. Function to trigger the acceptance
async function acceptOffer(id) {
    if (!confirm("Are you sure? This will deduct the fee from your purse and move the player to your squad.")) return;

    try {
        const res = await fetch(`${API}/api/market/accept-offer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                listingId: id,
                buyerTeamName: data.teamName
            })
        });

        const result = await res.json();
        if (result.success) {
            alert("🎊 DEAL DONE! Check your squad now.");
            location.reload(); // Refresh to show new player and updated purse
        } else {
            alert("❌ Error: " + result.error);
        }
    } catch (e) {
        alert("Failed to connect to transfer server.");
    }
}

// Call loadIncomingOffers inside your window.onload

loadIncomingOffers();

    </script>
</body>
</html>
