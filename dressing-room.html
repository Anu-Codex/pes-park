<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dressing Room | PES PARK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --bg: #030712; --card: #0f172a; --accent: #10b981; --border: #1e293b; --danger: #ef4444; --gold: #f59e0b; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }

        /* Loading Overlay */
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }

        /* Header Card */
        .header-card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .t-logo { width: 50px; height: 50px; object-fit: contain; background: #020617; border-radius: 8px; }
        .purse-val { font-size: 2rem; font-weight: 900; color: var(--accent); letter-spacing: -1px; }

        /* Boxes */
        .sub-box { background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h4 { margin: 0 0 20px; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        
        label { font-size: 0.7rem; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; display: block; }
        input, select { width: 100%; padding: 14px; background: #020617; border: 1px solid var(--border); color: white; border-radius: 12px; margin-bottom: 15px; font-size: 0.9rem; outline: none; }

        .btn-publish { width: 100%; padding: 16px; background: var(--accent); color: #020617; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        /* Squad Item */
        .squad-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 15px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .p-img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- Loading screen while data syncs -->
    <div id="loading-overlay"><i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i></div>

    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <a href="captain-login.html" style="color:var(--danger); text-decoration:none; font-size:0.8rem; font-weight:bold;"><i class="fa-solid fa-power-off"></i> LOGOUT</a>
            <span id="displayName" style="font-weight:900; font-style:italic; color:var(--accent); text-transform:uppercase;">Team Room</span>
        </div>

        <!-- Header -->
        <div class="header-card">
            <img id="displayLogo" src="" class="t-logo" onerror="this.src='https://via.placeholder.com/50'">
            <div>
                <div style="font-size: 0.65rem; color: #64748b;">REMAINING PURSE</div>
                <div class="purse-val" id="displayPurse">0M</div>
            </div>
        </div>

        <!-- Listing Form -->
        <div class="sub-box">
            <h4><i class="fa-solid fa-paper-plane"></i> Transfer Market Listing</h4>
            <label>Select Player to Release</label>
            <select id="playerToRelease"></select>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Release Fee (M)</label>
                    <input type="number" id="fee" placeholder="e.g. 50">
                </div>
                <div>
                    <label>Add-ons / Terms</label>
                    <input type="text" id="addons" placeholder="Optional">
                </div>
            </div>

            <label>Target Offer (Receiver)</label>
            <select id="targetTeam">
                <option value="General">Public Market (All Teams)</option>
            </select>

            <button class="btn-publish" onclick="publishListing()" id="pubBtn">Publish Listing</button>
        </div>

        <!-- Incoming Offers -->
        <div class="sub-box" id="offersBox" style="border-left: 4px solid var(--gold); display: none;">
            <h4><i class="fa-solid fa-bell-concierge"></i> Incoming Offers</h4>
            <div id="incomingOffersList"></div>
        </div>

        <!-- Squad List -->
        <div class="sub-box">
            <h4><i class="fa-solid fa-users"></i> Current Squad</h4>
            <div id="squadList"></div>
        </div>
    </div>

    <script>
        const API = "https://pes-park-backend.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const teamIdFromURL = urlParams.get('id');
        const data = JSON.parse(localStorage.getItem('activeCaptainTeam'));

        async function initDressingRoom() {
            if (!data || data.teamName !== teamIdFromURL) {
                window.location.href = 'captain-login.html';
                return;
            }

            try {
                // Fetch fresh data from the bridge
                const res = await fetch(`${API}/api/teams/profile/${encodeURIComponent(teamIdFromURL)}`);
                const fresh = await res.json();

                // 1. Update Header
                document.getElementById('displayName').innerText = fresh.team.name;
                document.getElementById('displayLogo').src = fresh.team.logoUrl || fresh.team.logo;
                document.getElementById('displayPurse').innerText = fresh.team.budget + "M";

                // 2. Fill Squad Dropdown & List
                const playerSelect = document.getElementById('playerToRelease');
                const squadBox = document.getElementById('squadList');
                
                playerSelect.innerHTML = fresh.players.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
                squadBox.innerHTML = fresh.players.map(p => `
                    <div class="squad-item">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <img src="${p.image || p.imageUrl}" class="p-img">
                            <span style="font-weight:bold; font-size:0.9rem;">${p.name}</span>
                        </div>
                        <span style="color:var(--accent); font-weight:800;">${p.marketValue || 0}M</span>
                    </div>
                `).join('');

                // 3. Load Other Teams for Offer dropdown
                const tRes = await fetch(`${API}/api/teams/all`);
                const allTeams = await tRes.json();
                const targetSelect = document.getElementById('targetTeam');
                allTeams.filter(t => t.name !== teamIdFromURL).forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.name; opt.innerText = t.name;
                    targetSelect.appendChild(opt);
                });

                // 4. Load Offers
                loadIncomingOffers();

                document.getElementById('loading-overlay').style.display = 'none';
            } catch (err) {
                console.error(err);
                alert("Sync Error: Backend is waking up. Refresh in 10 seconds.");
            }
        }

        async function publishListing() {
            const fee = document.getElementById('fee').value;
            if(!fee || fee <= 0) return alert("Enter a valid fee.");
            
            const btn = document.getElementById('pubBtn');
            btn.innerText = "PUBLISHING...";
            btn.disabled = true;

            const payload = {
                playerName: document.getElementById('playerToRelease').value,
                fromTeam: teamIdFromURL,
                releaseFee: fee,
                addons: document.getElementById('addons').value,
                targetTeam: document.getElementById('targetTeam').value
            };

            const res = await fetch(`${API}/api/market/list-player`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                alert("✅ Published!");
                location.reload();
            } else {
                alert("Failed to post.");
                btn.innerText = "Publish Listing";
                btn.disabled = false;
            }
        }

        async function loadIncomingOffers() {
            const res = await fetch(`${API}/api/market/listings`);
            const listings = await res.json();
            const myOffers = listings.filter(l => l.targetTeam === teamIdFromURL || (l.targetTeam === "General" && l.fromTeam !== teamIdFromURL));

            if (myOffers.length > 0) {
                document.getElementById('offersBox').style.display = 'block';
                document.getElementById('incomingOffersList').innerHTML = myOffers.map(o => `
                    <div class="squad-item" style="border-color:var(--gold); flex-direction:column; align-items:start;">
                        <div style="display:flex; justify-content:space-between; width:100%;">
                            <div><small style="color:var(--gold)">FROM: ${o.fromTeam}</small><div style="font-weight:bold;">${o.playerName}</div></div>
                            <div style="text-align:right;"><small>FEE</small><div style="font-weight:900;">${o.releaseFee}M</div></div>
                        </div>
                        <button onclick="acceptOffer('${o._id}')" style="width:100%; margin-top:10px; padding:8px; background:var(--gold); color:black; border-radius:8px; font-weight:bold;">ACCEPT DEAL</button>
                    </div>
                `).join('');
            }
        }

        async function acceptOffer(id) {
            if(!confirm("Deduct fee and transfer player to your squad?")) return;
            const res = await fetch(`${API}/api/market/accept-offer`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ listingId: id, buyerTeamName: teamIdFromURL })
            });
            if(res.ok) { alert("Deal Complete! 🤝"); location.reload(); }
        }

        window.onload = initDressingRoom;
    </script>
</body>
</html>
