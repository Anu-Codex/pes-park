<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dressing Room | PES PARK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --bg: #030712; --card: #0f172a; --accent: #10b981; --border: #1e293b; --gold: #f59e0b; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 15px; }
        #loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .container { max-width: 500px; margin: auto; }
        .header-card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .t-logo { width: 50px; height: 50px; object-fit: contain; }
        .sub-box { background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 20px; }
        input, select { width: 100%; padding: 14px; background: #020617; border: 1px solid var(--border); color: white; border-radius: 12px; margin-bottom: 15px; outline: none; }
        .btn-publish { width: 100%; padding: 16px; background: var(--accent); color: #020617; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .squad-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div style="text-align:center;">
            <i class="fa-solid fa-circle-notch fa-spin fa-3x" style="color:var(--accent)"></i>
            <p style="margin-top:15px; font-size:0.7rem; color:#64748b; letter-spacing:2px;">SYNCING SQUAD...</p>
        </div>
    </div>

    <div class="container">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <a href="captain-login.html" style="color:#ef4444; text-decoration:none; font-size:0.8rem; font-weight:bold;">LOGOUT</a>
            <span id="displayName" style="font-weight:bold; color:var(--accent);">TEAM ROOM</span>
        </div>

        <div class="header-card">
            <img id="tLogo" src="https://via.placeholder.com/50" class="t-logo">
            <div>
                <div style="font-size: 0.6rem; color: #64748b;">PURSE REMAINING</div>
                <div id="tPurse" style="font-size:2rem; font-weight:900; color:var(--accent);">0M</div>
            </div>
        </div>

        <div class="sub-box">
            <h4>TRANSFER LISTING</h4>
            <select id="playerList"></select>
            <input type="number" id="fee" placeholder="Release Fee (M)">
            <input type="text" id="addons" placeholder="Terms (Optional)">
            <select id="targetTeam"><option value="General">Public Market</option></select>
            <button class="btn-publish" onclick="publishListing()">Publish</button>
        </div>

        <div class="sub-box" id="offersBox" style="display:none; border-left:4px solid var(--gold);">
            <h4 style="color:var(--gold)">INCOMING OFFERS</h4>
            <div id="incomingOffersList"></div>
        </div>

        <div class="sub-box">
            <h4>MY SQUAD</h4>
            <div id="squadDisplay"></div>
        </div>
    </div>

    <script>
        const API = "https://pes-park-backend.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const teamName = urlParams.get('id');
        const captainData = JSON.parse(localStorage.getItem('activeCaptainTeam'));

        // EMERGENCY LOADER KILLER (If database is slow, show page anyway after 3s)
        setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; }, 3000);

        async function init() {
            if (!captainData || teamName !== captainData.teamName) {
                window.location.href = 'captain-login.html';
                return;
            }

            try {
                const res = await fetch(`${API}/api/teams/profile/${encodeURIComponent(teamName)}`);
                const data = await res.json();

                document.getElementById('displayName').innerText = data.team.name;
                document.getElementById('tPurse').innerText = data.team.budget + "M";
                if(data.team.logoUrl) document.getElementById('tLogo').src = data.team.logoUrl;

                document.getElementById('playerList').innerHTML = data.players.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
                document.getElementById('squadDisplay').innerHTML = data.players.map(p => `
                    <div class="squad-item">
                        <span><b>${p.name}</b></span>
                        <span style="color:var(--accent)">${p.soldTo.match(/\d+/)}M</span>
                    </div>
                `).join('');

                loadOffers();
            }
                // --- ADD THIS BLOCK TO POPULATE THE TEAM DROPDOWN ---
try {
    const teamsRes = await fetch(`${API}/api/teams/all`);
    const allTeams = await teamsRes.json();
    const targetSelect = document.getElementById('targetTeam');

    if (allTeams && allTeams.length > 0) {
        // Clear previous options except the first "Public Market" one
        targetSelect.innerHTML = '<option value="General">Public Market (All Teams)</option>';
        
        allTeams.forEach(t => {
            // Don't show the captain's own team in the receiver list
            if (t.name !== teamName) {
                const opt = document.createElement('option');
                opt.value = t.name;
                opt.innerText = t.name;
                targetSelect.appendChild(opt);
            }
        });
    }
} catch (e) {
    console.log("Error loading team list:", e);
}
// ---------------------------------------------------
     catch (e) { console.log("Load failed, using cached data"); }
            document.getElementById('loading-overlay').style.display = 'none';
        }

        async function loadOffers() {
            const res = await fetch(`${API}/api/market/listings`);
            const list = await res.json();
            const myOffers = list.filter(l => l.targetTeam === teamName || (l.targetTeam === "General" && l.fromTeam !== teamName));
            if(myOffers.length > 0) {
                document.getElementById('offersBox').style.display = 'block';
                document.getElementById('incomingOffersList').innerHTML = myOffers.map(o => `
                    <div class="squad-item" style="flex-direction:column; align-items:start;">
                        <div><b>${o.playerName}</b> from ${o.fromTeam}</div>
                        <button onclick="acceptOffer('${o._id}')" style="width:100%; margin-top:10px; background:var(--gold); border:none; padding:8px; border-radius:8px; font-weight:bold;">ACCEPT ${o.releaseFee}M</button>
                    </div>
                `).join('');
            }
        }

        async function acceptOffer(id) {
            const res = await fetch(`${API}/api/market/accept-offer`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ listingId: id, buyerTeamName: teamName })
            });
            if(res.ok) { alert("Transferred! ✅"); location.reload(); }
        }

        async function publishListing() {
            const payload = {
                playerName: document.getElementById('playerList').value,
                fromTeam: teamName,
                releaseFee: document.getElementById('fee').value,
                addons: document.getElementById('addons').value,
                targetTeam: document.getElementById('targetTeam').value
            };
            const res = await fetch(`${API}/api/market/list-player`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) location.reload();
        }

        window.onload = init;
    </script>
</body>
</html>
