<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dressing Room | PES PARK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --accent: #10b981;
            --border: #1e293b;
            --gold: #f59e0b;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 60px;
        }

        .container { max-width: 500px; margin: auto; }

        /* Header Area */
        .room-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px 5px;
        }

        .team-identity { display: flex; align-items: center; gap: 15px; }
        .t-logo-room { width: 45px; height: 45px; object-fit: contain; }
        .t-name-room { font-size: 1.2rem; font-weight: 900; letter-spacing: -0.5px; text-transform: uppercase; font-style: italic; }

        /* Purse Card */
        .purse-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.1);
        }

        .purse-label { font-size: 0.7rem; color: var(--accent); font-weight: 800; letter-spacing: 2px; margin-bottom: 10px; display: block; }
        .purse-value { font-size: 2.5rem; font-weight: 900; color: white; }
        .purse-value span { color: var(--accent); font-size: 1.2rem; margin-left: 5px; }

        /* Action Box */
        .sub-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h4 { margin: 0 0 15px; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }

        label { display: block; font-size: 0.7rem; color: #64748b; margin-bottom: 8px; font-weight: bold; }
        input, select {
            width: 100%; padding: 12px; background: #020617; border: 1px solid var(--border);
            color: white; border-radius: 10px; margin-bottom: 15px; font-size: 0.9rem; outline: none; box-sizing: border-box;
        }

        .action-btn {
            width: 100%; padding: 15px; background: var(--accent); color: #020617;
            border: none; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.3s;
        }

        /* Squad List */
        .player-row-mini {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .p-info-mini { display: flex; align-items: center; gap: 10px; }
        .p-img-mini { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; }
        .p-val-mini { color: var(--accent); font-weight: bold; font-size: 0.85rem; }

        #loading-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="loading-overlay"><i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i></div>

    <div class="container">
        <!-- Header -->
        <div class="room-header">
            <div class="team-identity">
                <img id="displayLogo" src="" class="t-logo-room">
                <span id="displayName" class="t-name-room">Loading...</span>
            </div>
            <button onclick="logout()" style="background:none; border:none; color:var(--danger); font-size:1.2rem;"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>

        <!-- Purse -->
        <div class="purse-card">
            <span class="purse-label">REMAINING PURSE</span>
            <div class="purse-value" id="displayPurse">0<span>M</span></div>
        </div>

        <!-- Transfer Action -->
        <div class="sub-box">
            <h4><i class="fa-solid fa-paper-plane"></i> Transfer Market Listing</h4>
            
            <label>Select Player to Release</label>
            <select id="playerToRelease"></select>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Release Fee (M)</label>
                    <input type="number" id="releaseFee" placeholder="e.g. 50">
                </div>
                <div>
                    <label>Add-ons / Terms</label>
                    <input type="text" id="addons" placeholder="Optional">
                </div>
            </div>

            <label>Target Offer (Team Name)</label>
            <select id="targetTeam">
                <option value="General">Public Market (All Teams)</option>
            </select>

            <button class="action-btn" onclick="submitTransfer()">PUBLISH LISTING</button>
        </div>

        <!-- Squad List -->
        <div class="sub-box">
            <h4><i class="fa-solid fa-users"></i> Current Squad</h4>
            <div id="squadList"></div>
        </div>
    </div>

    <script>
        const API = "https://pes-park-backend.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const teamNameFromURL = urlParams.get('id'); // Get unique ID from URL

        // Verify Session
        const captainInfo = JSON.parse(localStorage.getItem('captainInfo'));

        async function initDressingRoom() {
    const urlParams = new URLSearchParams(window.location.search);
    const teamIdFromURL = urlParams.get('id');

    // 1. Get the data we saved during login
    const data = JSON.parse(localStorage.getItem('activeCaptainTeam'));

    // 2. FIXED SECURITY CHECK
    // We compare the ID in the URL to the Team Name in the login data
    if (!data || data.teamName !== teamIdFromURL) {
        alert("⚠️ Unauthorised Access: Please login again.");
        window.location.href = 'captain-login.html';
        return;
    }

    try {
        // 3. Set UI Header & Purse (using data imported from Auction DB)
        document.getElementById('displayName').innerText = data.teamName + " DRESSING ROOM";
        document.getElementById('displayLogo').src = data.logo;
        document.getElementById('displayPurse').innerHTML = `${data.purse}<span>M</span>`;

        // 4. Render Squad
        const squadBox = document.getElementById('squadList');
        squadBox.innerHTML = data.squad.map(p => {
            // Extract numbers from "Team (50M)"
            const price = p.soldTo.match(/\d+/) || "0"; 
            return `
            <div class="player-row-mini">
                <div class="p-info-mini">
                    <img src="${p.imageUrl}" class="p-img-mini">
                    <span style="font-size:0.9rem;">${p.name}</span>
                </div>
                <span class="p-val-mini">${price}M</span>
            </div>`;
        }).join('');

        // Hide loading spinner
        document.getElementById('loading-overlay').style.display = 'none';

    } catch (err) {
        console.error(err);
        alert("Error displaying imported stats.");
    }
        }

        async function submitTransfer() {
            const fee = document.getElementById('releaseFee').value;
            if(!fee || fee <= 0) return alert("Please enter a release fee!");

            const btn = document.querySelector('.action-btn');
            btn.innerText = "PUBLISHING...";
            btn.disabled = true;

            const payload = {
                playerName: document.getElementById('playerToRelease').value,
                fromTeam: teamNameFromURL,
                releaseFee: fee,
                addons: document.getElementById('addons').value,
                targetTeam: document.getElementById('targetTeam').value
            };

            const res = await fetch(`${API}/api/market/list-player`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                alert("✅ Listing posted! Fee deducted from your purse.");
                location.reload();
            } else {
                alert("Failed to post listing.");
                btn.innerText = "PUBLISH LISTING";
                btn.disabled = false;
            }
        }

        function logout() {
            localStorage.removeItem('captainInfo');
            window.location.href = 'captain-login.html';
        }

        window.onload = initDressingRoom;
    </script>
</body>
</html>
