<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES PARK EFOOTBALL COMMUNITY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg: #060b13;
            --card-bg: #101926;
            --item-bg: #162130;
            --accent: #10b981;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        /* The main wrapper that forces vertical stacking */
        .main-container {
            width: 100%;
            max-width: 500px; /* Limits width to look like a mobile app */
            display: flex;
            flex-direction: column; /* FORCES TOP TO BOTTOM LAYOUT */
            gap: 30px; /* Space between the two sections */
        }

        /* HEADER SECTION */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo h2 { margin: 0; color: white; font-size: 1.2rem; }
        .logo span { color: var(--accent); font-size: 0.7rem; display: block; font-weight: bold; }
        
        .top-nav { display: flex; gap: 10px; }
        .nav-item { 
            color: var(--text-dim); text-decoration: none; width: 40px; height: 40px; 
            display: flex; align-items: center; justify-content: center; border-radius: 10px; 
        }
        .nav-item.active { background: rgba(16,185,129,0.1); color: var(--accent); border: 1px solid rgba(16,185,129,0.2); }

        /* FIRST SECTION: LEAGUE STATS */
        .league-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid var(--border);
        }

        .dropdown-row { display: flex; gap: 10px; margin-bottom: 20px; }
        select { background: #1e293b; color: white; border: 1px solid var(--border); padding: 8px; border-radius: 8px; }

        .league-title { font-size: 1.8rem; margin: 10px 0; }
        .league-leader { background: rgba(16,185,129,0.1); padding: 8px 15px; border-radius: 20px; display: inline-block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 20px;}
        .league-leader b { color: white; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .stat-box { background: var(--item-bg); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
        .stat-box i { font-size: 1.2rem; margin-bottom: 10px; display: block; }
        .stat-box .label { font-size: 0.75rem; color: var(--text-dim); }
        .stat-box .val { font-size: 1.4rem; font-weight: bold; display: block; margin: 4px 0; }

        /* SECOND SECTION: DASHBOARD VIEW (Under the first one) */
        .dashboard-section { width: 100%; }
        
        .section-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-title-row h3 { font-size: 0.85rem; color: var(--text-dim); letter-spacing: 1px; margin: 0; }

        .players-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .total-info { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .icon-sq { background: #1e293b; padding: 12px; border-radius: 10px; color: #6366f1; }

        .search-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; }

        .table-header { display: flex; justify-content: space-between; padding: 10px; color: var(--text-dim); font-size: 0.8rem; border-bottom: 1px solid var(--border); }
        
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 10px; border-bottom: 1px solid var(--border); }
        .p-details { display: flex; align-items: center; gap: 12px; }
        .p-img { width: 45px; height: 45px; border-radius: 8px; background: var(--bg); }
        .t-details { display: flex; align-items: center; gap: 8px; }
        .t-logo { width: 25px; height: 25px; border-radius: 4px; }

        /* Loader Overlay Styling */
#loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #060b13; /* Same as your site bg */
    z-index: 10000; /* Stays on top of everything */
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease;
}

.loader-content {
    width: 80%;
    max-width: 350px;
    text-align: center;
}

.loader-logo {
    margin-bottom: 30px;
}

.loader-logo i {
    font-size: 3rem;
    color: #10b981;
    margin-bottom: 10px;
    display: block;
}

.loader-logo h2 {
    font-size: 1.5rem;
    letter-spacing: 2px;
}

.loader-logo span { color: #10b981; }

#status-text {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-bottom: 15px;
    height: 20px; /* Prevents jumping when text changes */
    font-weight: 500;
}

/* The Progress Bar */
.progress-container {
    width: 100%;
    height: 6px;
    background: #1e293b;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
}

#progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    transition: width 0.1s linear; /* Smooth fill */
}

.loading-footer {
    font-size: 0.7rem;
    color: #334155;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Hide the rest of the site until loaded */
.content-loaded body {
    overflow: auto;
}
        /* Add this to your existing CSS */
.no-animation {
    display: none !important;
}
        /* Ranking Specific Styles */
.ranking-header {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 10px;
    margin-bottom: 20px;
}
.ranking-header i { font-size: 2rem; color: #f59e0b; }
.ranking-header h4 { margin: 0; letter-spacing: 1px; font-size: 0.9rem; }

.rank-row {
    display: flex;
    align-items: center;
    padding: 15px 10px;
    border-bottom: 1px solid #1e293b;
    gap: 15px;
}

.rank-num {
    width: 30px;
    font-weight: bold;
    color: #475569;
    font-size: 0.9rem;
}

.rank-1-icon { color: #f59e0b; font-size: 1.2rem; width: 30px; text-align: center; }

.rank-info {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #1e293b; /* The line under name */
    padding-bottom: 5px;
}

.rank-pts {
    text-align: right;
}
.rank-pts b { display: block; font-size: 1rem; color: #f59e0b; }
.rank-pts span { font-size: 0.7rem; color: #475569; text-transform: uppercase; }
    </style>
</head>
<body>
    <!-- Loader Overlay -->
<div id="loader-overlay">
    <div class="loader-content">
        <div class="loader-logo">
            <i class="fa-solid fa-shield-halved"></i>
            <h2>PES <span>PARK</span></h2>
        </div>
        
        <p id="status-text">Initializing...</p>
        
        <div class="progress-container">
            <div id="progress-fill"></div>
        </div>
        
        <p class="loading-footer">Version 7.0.2 • Secure Connection</p>
    </div>
</div>

    <div class="main-container">
        
        <!-- HEADER -->
        <header>
            <div class="logo">
                <h2>PES <b>PARK</b></h2>
                <span>EFOOTBALL COMMUNITY</span>
            </div>
            <nav class="top-nav">
                <a href="#" class="nav-item active"><i class="fa-solid fa-chart-simple"></i></a>
                <a href="halloffame.html" class="nav-item"><i class="fa-solid fa-trophy"></i></a>
                <a href="login.html" class="nav-item"><i class="fa-solid fa-right-to-bracket"></i></a>
            </nav>
        </header>

        <!-- 1st DIV: LEAGUE INFO & STATS -->
        <section class="league-card">
            <div class="dropdown-row">
                <select><option>2026</option></select>
                <select><option>Season 7 • Current</option></select>
            </div>
            <h1 class="league-title">PES PARK<br>PLayers Data</h1>
            <div class="league-leader">League leader <b>BLUE LOCK • 0 pts</b></div>

            <div class="stats-grid">
                <div class="stat-box">
                    <i class="fa-solid fa-trophy" style="color: #f59e0b;"></i>
                    <span class="label">BDR Leader</span>
                    <span class="val" id="bdrVal">0</span>
                    <span class="label" id="bdrName">Abhay</span>
                </div>
                <div class="stat-box">
                    <i class="fa-solid fa-chart-line" style="color: #ef4444;"></i>
                    <span class="label">Highest MV</span>
                    <span class="val" id="mvVal">0</span>
                    <span class="label" id="mvName">Abhay</span>
                </div>
                <div class="stat-box">
                    <i class="fa-solid fa-users" style="color: #3b82f6;"></i>
                    <span class="label">Teams</span>
                    <span class="val" id="teamCount">8</span>
                    <span class="label">in the league</span>
                </div>
                <div class="stat-box">
                    <i class="fa-solid fa-user-check" style="color: #a855f7;"></i>
                    <span class="label">Players</span>
                    <span class="val" id="playerCount">117</span>
                    <span class="label">registered</span>
                </div>
            </div>
        </section>

        <!-- 2nd DIV: DASHBOARD VIEW (NOW UNDERNEATH) -->
        <section class="dashboard-section">
            <div class="section-title-row">
    <h3>DASHBOARD VIEW</h3>
    <select id="viewSelector" onchange="toggleView()">
        <option value="total">Total players</option>
        <option value="bdr">BDR Rankings</option>
                    <option>Auction Tour</option>
                    <option>Quick Tour</option>
                    <option>Solo Tour</option>
                    <option>Weekend Series</option>
                    <option>League Table</option>
                    <option>UCL</option>
                    <option>Market Value</option>
                    <option>Trophies</option>
                
                </select>
            </div>

            <div class="players-card">
                <div id="dynamicContent">
                
                </div>
            </div>
        </section>

    </div>
    <script>
    const API = "https://pes-park-backend.onrender.com"; 
    let allPlayers = []; // Global store for players

    // 1. Initial Loader & Data Fetching
    async function manageLoader() {
        const overlay = document.getElementById('loader-overlay');
        const hasSeenLoader = sessionStorage.getItem('hasSeenLoader');

        if (hasSeenLoader === 'true') {
            overlay.classList.add('no-animation');
            initPage();
        } else {
            runSplashAnimation();
            sessionStorage.setItem('hasSeenLoader', 'true');
        }
    }

    function runSplashAnimation() {
        const overlay = document.getElementById('loader-overlay');
        const fill = document.getElementById('progress-fill');
        const status = document.getElementById('status-text');
        let progress = 0;
        const duration = 5000; 
        const intervalTime = 50; 
        const step = 100 / (duration / intervalTime);

        const messages = [
            { point: 0, text: "Connecting to Server..." },
            { point: 25, text: "Establishing Secure Connection..." },
            { point: 50, text: "Fetching PES PARK Database..." },
            { point: 75, text: "Synchronizing Player Records..." },
            { point: 90, text: "Server Connected Successfully!" }
        ];

        const timer = setInterval(() => {
            progress += step;
            if (progress > 100) progress = 100;
            fill.style.width = progress + "%";
            messages.forEach(msg => { if (progress >= msg.point) status.innerText = msg.text; });

            if (progress >= 100) {
                clearInterval(timer);
                setTimeout(() => {
                    overlay.style.opacity = "0";
                    setTimeout(() => { overlay.style.display = "none"; }, 800);
                }, 500);
            }
        }, intervalTime);

        initPage();
    }

    // 2. Fetch Data and Setup UI
    async function initPage() {
        try {
            // Fetch Stats (The top 4 boxes)
            const statsRes = await fetch(`${API}/api/stats`);
            const stats = await statsRes.json();
            if (stats) {
                document.getElementById('bdrVal').innerText = stats.bdrValue || 0;
                document.getElementById('bdrName').innerText = stats.bdrLeader || "None";
                document.getElementById('mvVal').innerText = stats.mvValue || 0;
                document.getElementById('mvName').innerText = stats.highestMV || "None";
                document.getElementById('teamCount').innerText = stats.teamsCount || 0;
            }

            // Fetch Players
            const playerRes = await fetch(`${API}/api/players`);
            allPlayers = await playerRes.json();

            // Update registered count in top boxes
            document.getElementById('playerCount').innerText = allPlayers.length;

            // Trigger the dashboard view
            toggleView();

        } catch (error) {
            console.error("Initialization Error:", error);
            document.getElementById('dynamicContent').innerHTML = '<p style="text-align:center; color:red;">Failed to connect to server.</p>';
        }
    }

    // 3. View Toggler (BDR vs Total Players)
    function toggleView() {
        const view = document.getElementById('viewSelector').value;
        const container = document.getElementById('dynamicContent');

        if (view === "bdr") {
            renderBDRRankings(container);
        } else {
            renderTotalPlayers(container);
        }
    }

    function renderTotalPlayers(container) {
        container.innerHTML = `
            <div class="total-info">
                <div class="icon-sq"><i class="fa-solid fa-users-viewfinder"></i></div>
                <div>
                    <span style="font-size: 0.7rem; color: var(--text-dim); display:block;">TOTAL PLAYERS</span>
                    <h4 style="margin: 0;">${allPlayers.length} registered</h4>
                </div>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-dim);"></i>
                <input type="text" id="searchInput" placeholder="Search players or teams..." onkeyup="filterList()">
            </div>

            <div class="table-header">
                <span>Player</span>
                <span>Team</span>
            </div>

            <div id="playerTableList">
                ${allPlayers.map(p => `
                    <div class="player-row" onclick="window.location.href='player.html?id=${p._id}'" style="cursor:pointer">
                        <div class="p-details">
                            <img src="${p.image || 'https://via.placeholder.com/45'}" class="p-img" onerror="this.src='https://via.placeholder.com/45'">
                            <div>
                                <span style="display:block; font-weight:bold;">${p.name}</span>
                                <span style="font-size:0.8rem; color:var(--text-dim);">"${p.nickname || ''}"</span>
                            </div>
                        </div>
                        <div class="t-details">
                            ${p.teamName ? `
                                <img src="${p.teamLogo || 'https://via.placeholder.com/25'}" class="t-logo">
                                <span style="font-size:0.8rem; color:var(--text-dim); text-transform:uppercase;">${p.teamName}</span>
                            ` : '<span style="color:#334155;">—</span>'}
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderBDRRankings(container) {
        const sorted = [...allPlayers].sort((a, b) => (b.bdrPoints || 0) - (a.bdrPoints || 0));
        let html = `
            <div class="ranking-header">
                <i class="fa-solid fa-trophy"></i>
                <div>
                    <span style="color: #64748b; font-size: 0.7rem; font-weight: bold;">BDR RANKING</span>
                    <h4>BALLOND'OR</h4>
                </div>
            </div>
        `;

        html += sorted.map((p, index) => {
            const rank = index + 1;
            const isFirst = rank === 1;
            return `
                <div class="rank-row" onclick="window.location.href='player.html?id=${p._id}'" style="cursor:pointer">
                    <div class="${isFirst ? 'rank-1-icon' : 'rank-num'}">
                        ${isFirst ? '<i class="fa-solid fa-crown"></i>' : '#' + rank}
                    </div>
                    <img src="${p.image || 'https://via.placeholder.com/45'}" class="p-img" style="width:45px; height:45px; border-radius:8px;">
                    <div class="rank-info">
                        <span style="font-weight: bold; font-size: 1rem;">${p.name}</span>
                        <div class="rank-pts">
                            <b>${p.bdrPoints || 0}</b>
                            <span>pts</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        container.innerHTML = html;
    }

    // 4. Search Filter Logic
    function filterList() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.getElementsByClassName('player-row');
        for (let row of rows) {
            row.style.display = row.innerText.toLowerCase().includes(input) ? "flex" : "none";
        }
    }

    window.addEventListener('DOMContentLoaded', manageLoader);
    </script>

                    
</body>
</html>
