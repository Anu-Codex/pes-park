<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS LIVE | STADIUM STREAM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- HLS Player Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
        :root { --bg: #020617; --accent: #10b981; --danger: #ef4444; }
        
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* Top Broadcast Bar */
        .broadcast-header {
            height: 60px; background: #000; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 20px; border-bottom: 2px solid var(--accent);
            z-index: 10;
        }

        .live-indicator {
            background: var(--danger); color: white; padding: 4px 12px; border-radius: 4px;
            font-family: 'Orbitron'; font-size: 0.7rem; font-weight: 900; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Video Container */
        .video-wrapper {
            flex: 1; background: #000; position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        video {
            width: 100%; height: 100%; max-height: 100vh;
            object-fit: contain; /* Keeps aspect ratio perfect */
            outline: none;
        }

        /* Loading / Error States */
        #status-overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: var(--bg); z-index: 5;
        }

        .btn-play {
            background: var(--accent); color: #000; border: none; padding: 15px 30px;
            border-radius: 50px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="broadcast-header">
        <div style="display:flex; align-items:center; gap:15px;">
            <div class="live-indicator">LIVE</div>
            <h2 id="matchTitle" style="margin:0; font-size:1.1rem; text-transform:uppercase; letter-spacing:1px;">SYNCING STREAM...</h2>
        </div>
        <div style="color:var(--accent); font-size:0.7rem; font-weight:bold;">
            <i class="fa-solid fa-signal"></i> 4K NEURAL FEED BY NEXUS LEGENDS
        </div>
    </div>

    <div class="video-wrapper">
        <!-- THE ACTUAL PLAYER -->
        <video id="video" controls playsinline></video>

        <!-- Status Overlay -->
        <div id="status-overlay">
            <i class="fa-solid fa-circle-notch fa-spin fa-3x" style="color:var(--accent); margin-bottom:20px;"></i>
            <h3 id="status-msg">INITIALIZING ENCRYPTED LINK...</h3>
            <button id="manual-play" class="btn-play" style="display:none;" onclick="startStream()">START BROADCAST</button>
        </div>
    </div>

    <script>
        const API = "https://nexus-database-v2.onrender.com";
        const video = document.getElementById('video');
        const overlay = document.getElementById('status-overlay');
        const statusMsg = document.getElementById('status-msg');
        const playBtn = document.getElementById('manual-play');

        let streamSource = "";

        async function init() {
            try {
                const res = await fetch(`${API}/api/live/now`);
                const data = await res.json();

                if (data.isActive && data.url) {
                    document.getElementById('matchTitle').innerText = data.title;
                    streamSource = data.url;
                    
                    // Show play button (Browsers block auto-play with sound)
                    statusMsg.innerText = "SIGNAL ACQUIRED";
                    playBtn.style.display = "block";
                    document.querySelector('.fa-spin').style.display = "none";
                } else {
                    statusMsg.innerText = "NO ACTIVE FEED FOUND";
                }
            } catch (e) {
                statusMsg.innerText = "CONNECTION TO NEXUS HUB LOST";
            }
        }

        function startStream() {
            overlay.style.display = "none";
            
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamSource);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } 
            // For Safari/iOS which support HLS natively
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamSource;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        init();
    </script>
</body>
</html>
